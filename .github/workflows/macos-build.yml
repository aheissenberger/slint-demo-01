name: macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS desktop app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1-aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: macos-arm64
          cache-targets: true
          cache-all-crates: true

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Determine package version
        id: package-version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "slint-demo") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package macOS app bundle
        env:
          APP_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="target/release/bundle/slint-demo.app"
          rm -rf "target/release/bundle"
          mkdir -p "${bundle}/Contents/MacOS"
          cp target/release/slint-demo "${bundle}/Contents/MacOS/slint-demo"
          chmod +x "${bundle}/Contents/MacOS/slint-demo"
          cat > "${bundle}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>slint-demo</string>
            <key>CFBundleDisplayName</key>
            <string>slint-demo</string>
            <key>CFBundleIdentifier</key>
            <string>dev.slint-agent.desktop</string>
            <key>CFBundleExecutable</key>
            <string>slint-demo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.productivity</string>
          </dict>
          </plist>
          PLIST

      - name: Archive macOS app bundle (preserve permissions)
        run: |
          set -euo pipefail
          cd target/release/bundle
          # actions/upload-artifact zips directories without preserving the
          # executable bit, which breaks the bundled binary (Finder falls
          # back to opening it as a plain folder). tar preserves permissions.
          tar -czf slint-demo-macos-arm64.tar.gz "slint-demo.app"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: slint-demo-macos-arm64
          path: target/release/bundle/slint-demo-macos-arm64.tar.gz
          if-no-files-found: error
