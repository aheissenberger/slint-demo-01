name: macOS build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS desktop app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: macos-arm64
          cache-targets: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --workspace --all-features

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --locked

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Determine package version
        id: package-version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "slint-demo") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate macOS signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for required_secret in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_DEVELOPER_ID_APPLICATION \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::${required_secret} must be configured to produce a Gatekeeper-compatible macOS build."
              exit 1
            fi
          done

      - name: Package macOS app bundle
        env:
          APP_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="target/release/bundle/slint-demo.app"
          rm -rf "target/release/bundle"
          mkdir -p "${bundle}/Contents/MacOS"
          cp target/release/slint-demo "${bundle}/Contents/MacOS/slint-demo"
          chmod +x "${bundle}/Contents/MacOS/slint-demo"
          cat > "${bundle}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>slint-demo</string>
            <key>CFBundleDisplayName</key>
            <string>slint-demo</string>
            <key>CFBundleIdentifier</key>
            <string>dev.slint-agent.desktop</string>
            <key>CFBundleExecutable</key>
            <string>slint-demo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.productivity</string>
          </dict>
          </plist>
          PLIST

      - name: Validate macOS app bundle
        run: |
          set -euo pipefail
          plutil -lint "target/release/bundle/slint-demo.app/Contents/Info.plist"
          test -x "target/release/bundle/slint-demo.app/Contents/MacOS/slint-demo"
          file "target/release/bundle/slint-demo.app/Contents/MacOS/slint-demo"

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"

          echo "keychain_path=${keychain_path}" >> "$GITHUB_OUTPUT"
          echo "certificate_path=${certificate_path}" >> "$GITHUB_OUTPUT"

      - name: Sign macOS app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime --timestamp \
            --sign "${APPLE_DEVELOPER_ID_APPLICATION}" \
            "target/release/bundle/slint-demo.app"
          codesign --verify --deep --strict --verbose=2 \
            "target/release/bundle/slint-demo.app"

      - name: Create notarization archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd target/release/bundle
          ditto -c -k --keepParent "slint-demo.app" "slint-demo-macos-arm64.zip"

      - name: Notarize macOS app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "target/release/bundle/slint-demo-macos-arm64.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "target/release/bundle/slint-demo.app"
          xcrun stapler validate "target/release/bundle/slint-demo.app"
          spctl --assess --type execute --verbose=4 "target/release/bundle/slint-demo.app"

      - name: Create distributable macOS archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd target/release/bundle
          rm "slint-demo-macos-arm64.zip"
          ditto -c -k --keepParent "slint-demo.app" "slint-demo-macos-arm64.zip"

      - name: Archive unsigned verification app bundle
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          set -euo pipefail
          cd target/release/bundle
          ditto -c -k --keepParent "slint-demo.app" "slint-demo-macos-arm64-unsigned.zip"

      - name: Remove signing materials
        if: always() && steps.signing.outcome == 'success'
        run: |
          set -euo pipefail
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}"
          rm -f "${{ steps.signing.outputs.certificate_path }}"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'slint-demo-macos-arm64' || 'slint-demo-macos-arm64-unsigned' }}
          path: ${{ startsWith(github.ref, 'refs/tags/v') && 'target/release/bundle/slint-demo-macos-arm64.zip' || 'target/release/bundle/slint-demo-macos-arm64-unsigned.zip' }}
          if-no-files-found: error
