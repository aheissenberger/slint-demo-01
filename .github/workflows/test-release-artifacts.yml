name: Test release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build unsigned Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          shared-key: release-windows-x86_64
          cache-targets: true
          cache-all-crates: true

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "WiX Toolset installation failed with exit code $LASTEXITCODE."
            }
            $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction Stop |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          Write-Host "Using WiX Toolset bin folder: $($wixBin.FullName)"
          $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure cargo-wix is available
        shell: pwsh
        env:
          CARGO_WIX_VERSION: "0.3.9"
        run: |
          $installed = $null
          if (Get-Command cargo-wix -ErrorAction SilentlyContinue) {
            # A cached ~/.cargo/bin may carry a different cargo-wix build, so the
            # pinned version has to be verified instead of assumed.
            $installed = (cargo wix --version) -split '\s+' | Select-Object -Last 1
          }
          if ($installed -ne $env:CARGO_WIX_VERSION) {
            cargo +1.98.1 install cargo-wix --version $env:CARGO_WIX_VERSION --locked --force
            if ($LASTEXITCODE -ne 0) {
              throw "cargo-wix installation failed with exit code $LASTEXITCODE."
            }
          }
          cargo wix --version

      - name: Build Windows installer (MSI)
        shell: pwsh
        run: |
          # Reuse the production binary built with --no-default-features.
          # --target-bin-dir makes the externally managed build explicit and
          # avoids cargo-wix's warning for an ambiguous --no-build invocation.
          cargo wix --package slint-demo --culture de-DE --nocapture --no-build `
            --target-bin-dir target/release --output target/wix/slint-demo.msi

      - name: Smoke-test unsigned Windows installer and EXE
        shell: pwsh
        run: |
          $installer = Resolve-Path target/wix/slint-demo.msi
          $installLog = Join-Path $env:RUNNER_TEMP 'slint-demo-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'slint-demo-msi-uninstall.log'
          $dataDirectory = Join-Path $env:RUNNER_TEMP 'slint-demo-smoke-data'
          # Must match APPLICATIONFOLDER/Bin in crates/slint-demo/wix/main.wxs.
          $application = Join-Path $env:ProgramFiles 'Slint Agent Desktop\bin\slint-demo.exe'
          $uninstallFailure = $null

          $installProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', $installer, '/qn', '/norestart', '/l*v', $installLog
          )
          if ($installProcess.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installProcess.ExitCode). Log: $installLog"
          }

          try {
            if (-not (Test-Path $application -PathType Leaf)) {
              throw "Installed application was not found at $application."
            }

            # GitHub-hosted Windows runners have no interactive desktop. This
            # verifies the installed EXE's runtime, lock, database, and migrations
            # without treating unavailable GUI infrastructure as an app failure.
            $env:SLINT_DEMO_DATA_DIR = $dataDirectory
            $selfTestProcess = Start-Process -FilePath $application -PassThru -Wait -NoNewWindow `
              -ArgumentList '--verify-installation'
            if ($selfTestProcess.ExitCode -ne 0) {
              throw "Installed application self-test failed with exit code $($selfTestProcess.ExitCode)."
            }
          } finally {
            Remove-Item Env:\SLINT_DEMO_DATA_DIR -ErrorAction SilentlyContinue
            $uninstallProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
              '/x', $installer, '/qn', '/norestart', '/l*v', $uninstallLog
            )
            if ($uninstallProcess.ExitCode -ne 0) {
              $uninstallFailure = "MSI uninstallation failed with exit code $($uninstallProcess.ExitCode). Log: $uninstallLog"
            } elseif (Test-Path $application) {
              $uninstallFailure = "Installed application remained after MSI uninstallation."
            }
          }

          # Reached only when the smoke test itself succeeded, so a cleanup
          # failure is reported without masking an earlier error.
          if ($uninstallFailure) {
            throw $uninstallFailure
          }

      - name: Upload Windows installer diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slint-demo-release-installer-diagnostics
          path: |
            ${{ runner.temp }}/slint-demo-msi-install.log
            ${{ runner.temp }}/slint-demo-msi-uninstall.log
          if-no-files-found: ignore

      - name: Generate Windows SBOM and checksums
        shell: pwsh
        run: |
          cargo +1.98.1 install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) {
            throw "cargo-cyclonedx installation failed with exit code $LASTEXITCODE."
          }
          cargo cyclonedx --format json --all --all-features --target all
          if ($LASTEXITCODE -ne 0) {
            throw "cargo-cyclonedx failed with exit code $LASTEXITCODE."
          }

          $artifactDir = New-Item -ItemType Directory -Force target/release-artifacts/windows-x86_64
          Copy-Item target/release/slint-demo.exe $artifactDir
          Copy-Item target/wix/slint-demo.msi $artifactDir
          Copy-Item crates/slint-demo/slint-demo.cdx.json (Join-Path $artifactDir 'slint-demo.cyclonedx.json')

          Push-Location $artifactDir
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Pop-Location

      - name: Upload unsigned Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slint-demo-windows-x86_64-unsigned-test-release
          path: target/release-artifacts/windows-x86_64/*
          if-no-files-found: error

      - name: Attest unsigned Windows release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/release-artifacts/windows-x86_64/*

  macos:
    name: Build unsigned macOS validation artifact
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          shared-key: release-macos-arm64
          cache-targets: true
          cache-all-crates: true

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Determine package version
        id: package-version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "slint-demo") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package unsigned macOS app bundle
        env:
          APP_VERSION: ${{ steps.package-version.outputs.version }}
        run: ./scripts/package-macos-app "${APP_VERSION}"

      - name: Create unsigned macOS artifact
        run: |
          set -euo pipefail
          mkdir -p target/release-artifacts/macos-arm64
          cd target/release/bundle
          ditto -c -k --keepParent "slint-demo.app" "../../release-artifacts/macos-arm64/slint-demo-macos-arm64-unsigned.zip"

      - name: Generate macOS SBOM and checksums
        run: |
          set -euo pipefail
          cargo +1.98.1 install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all --all-features --target all
          cp crates/slint-demo/slint-demo.cdx.json target/release-artifacts/macos-arm64/slint-demo.cyclonedx.json
          cd target/release-artifacts/macos-arm64
          shasum -a 256 slint-demo-macos-arm64-unsigned.zip slint-demo.cyclonedx.json > SHA256SUMS.txt

      - name: Upload unsigned macOS validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slint-demo-macos-arm64-unsigned-test-release
          path: target/release-artifacts/macos-arm64/*
          if-no-files-found: error

      - name: Attest unsigned macOS validation artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/release-artifacts/macos-arm64/*
