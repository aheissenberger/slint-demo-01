name: Windows build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          shared-key: windows-x86_64
          cache-targets: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default production build posture
        run: cargo check --locked --workspace --all-targets

      - name: Lint all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Validate Slint and agent API static contract
        shell: pwsh
        run: |
          cargo check --locked -p slint-demo --all-targets --features agent-api
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          cargo run --locked --quiet -p slint-contract --bin slint-contract-check -- ui > $env:RUNNER_TEMP\slint-contract.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python scripts/agent-api-check
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run all tests
        run: cargo test --locked --workspace --all-features

      - name: Audit dependency policy
        shell: pwsh
        run: |
          cargo +1.98.1 install cargo-deny --version 0.20.2 --locked
          if ($LASTEXITCODE -ne 0) {
            throw "cargo-deny installation failed with exit code $LASTEXITCODE."
          }
          cargo deny check advisories bans licenses sources

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slint-demo-windows-x86_64
          path: target/release/slint-demo.exe
          if-no-files-found: error

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "WiX Toolset installation failed with exit code $LASTEXITCODE."
            }
            $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction Stop |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          Write-Host "Using WiX Toolset bin folder: $($wixBin.FullName)"
          $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure cargo-wix is available
        shell: pwsh
        env:
          CARGO_WIX_VERSION: "0.3.8"
        run: |
          $installed = $null
          if (Get-Command cargo-wix -ErrorAction SilentlyContinue) {
            # A cached ~/.cargo/bin may carry a different cargo-wix build, so the
            # pinned version has to be verified instead of assumed.
            $installed = (cargo wix --version) -split '\s+' | Select-Object -Last 1
          }
          if ($installed -ne $env:CARGO_WIX_VERSION) {
            cargo install cargo-wix --version $env:CARGO_WIX_VERSION --locked --force
            if ($LASTEXITCODE -ne 0) {
              throw "cargo-wix installation failed with exit code $LASTEXITCODE."
            }
          }
          cargo wix --version

      - name: Build Windows installer (MSI)
        shell: pwsh
        run: |
          # --no-build reuses the release binary produced above with
          # --no-default-features, so the MSI never bundles the agent-api server.
          cargo wix --package slint-demo --culture de-DE --nocapture --no-build --output target/wix/slint-demo.msi

      - name: Validate Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path target/wix/slint-demo.msi
          $installerInfo = Get-Item $installer
          if ($installerInfo.Length -le 0) {
            throw "The MSI installer is empty."
          }
          Write-Host "Validated MSI artifact: $($installerInfo.FullName) ($($installerInfo.Length) bytes)"

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path target/wix/slint-demo.msi
          # Must match APPLICATIONFOLDER/Bin in crates/slint-demo/wix/main.wxs.
          $application = Join-Path $env:ProgramFiles 'Slint Agent Desktop\bin\slint-demo.exe'
          $smokeProcess = $null
          $uninstallFailure = $null

          $installProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', $installer, '/qn', '/norestart'
          )
          if ($installProcess.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installProcess.ExitCode)."
          }

          try {
            if (-not (Test-Path $application -PathType Leaf)) {
              throw "Installed application was not found at $application."
            }
            $smokeProcess = Start-Process -FilePath $application -PassThru
            Start-Sleep -Seconds 5
            if ($smokeProcess.HasExited) {
              throw "Installed application exited during smoke test with code $($smokeProcess.ExitCode)."
            }
          } finally {
            if ($null -ne $smokeProcess -and -not $smokeProcess.HasExited) {
              Stop-Process -Id $smokeProcess.Id -Force
              $smokeProcess.WaitForExit(10000) | Out-Null
            }
            $uninstallProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
              '/x', $installer, '/qn', '/norestart'
            )
            if ($uninstallProcess.ExitCode -ne 0) {
              $uninstallFailure = "MSI uninstallation failed with exit code $($uninstallProcess.ExitCode)."
            } elseif (Test-Path $application) {
              $uninstallFailure = "Installed application remained after MSI uninstallation."
            }
          }

          # Reached only when the smoke test itself succeeded, so a cleanup
          # failure is reported without masking an earlier error.
          if ($uninstallFailure) {
            throw $uninstallFailure
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slint-demo-windows-x86_64-installer
          path: target/wix/slint-demo.msi
          if-no-files-found: error
