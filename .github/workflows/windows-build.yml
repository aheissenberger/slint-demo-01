name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: windows-x86_64
          cache-targets: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --workspace --all-features

      - name: Audit dependencies
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --locked

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: slint-demo-windows-x86_64
          path: target/release/slint-demo.exe
          if-no-files-found: error

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "WiX Toolset installation failed with exit code $LASTEXITCODE."
            }
            $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction Stop |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          Write-Host "Using WiX Toolset bin folder: $($wixBin.FullName)"
          $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure cargo-wix is available
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --version 0.3.8 --locked
            if ($LASTEXITCODE -ne 0) {
              throw "cargo-wix installation failed with exit code $LASTEXITCODE."
            }
          }
          cargo wix --version

      - name: Build Windows installer (MSI)
        run: cargo wix --package slint-demo --culture de-DE --nocapture --output target/wix/slint-demo.msi

      - name: Validate Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path target/wix/slint-demo.msi
          $installerInfo = Get-Item $installer
          if ($installerInfo.Length -le 0) {
            throw "The MSI installer is empty."
          }
          Write-Host "Validated MSI artifact: $($installerInfo.FullName) ($($installerInfo.Length) bytes)"

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path target/wix/slint-demo.msi
          $application = Join-Path $env:ProgramFiles 'slint-demo\bin\slint-demo.exe'

          $installProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/i', $installer, '/qn', '/norestart'
          )
          if ($installProcess.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installProcess.ExitCode)."
          }
          if (-not (Test-Path $application -PathType Leaf)) {
            throw "Installed application was not found at $application."
          }

          $uninstallProcess = Start-Process msiexec.exe -PassThru -Wait -NoNewWindow -ArgumentList @(
            '/x', $installer, '/qn', '/norestart'
          )
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "MSI uninstallation failed with exit code $($uninstallProcess.ExitCode)."
          }
          if (Test-Path $application) {
            throw "Installed application remained after MSI uninstallation."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: slint-demo-windows-x86_64-installer
          path: target/wix/slint-demo.msi
          if-no-files-found: error
