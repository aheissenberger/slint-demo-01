name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1-x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: windows-x86_64
          cache-targets: true
          cache-all-crates: true

      - name: Build release executable
        run: cargo build --locked --release -p slint-demo --no-default-features

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: slint-demo-windows-x86_64
          path: target/release/slint-demo.exe
          if-no-files-found: error

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v*\bin' -Directory -ErrorAction Stop |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixBin) {
            throw "WiX Toolset bin folder not found after installation."
          }
          Write-Host "Using WiX Toolset bin folder: $($wixBin.FullName)"
          $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build Windows installer (MSI)
        run: cargo wix --no-build --package slint-demo --nocapture --output target/wix/slint-demo.msi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: slint-demo-windows-x86_64-installer
          path: target/wix/slint-demo.msi
          if-no-files-found: error
