[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/slint-demo",
  "crates/agent-api",
  "crates/slint-contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
authors = ["Copilot"]
license = "MIT"
repository = "https://github.com/aheissenberger/slint-demo-01"
description = "Agent-operated Rust and Slint desktop application"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.2", features = ["env-filter", "json"] }
slint = "1.18"
slint-build = "1.18"
rfd = "0.17"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
panic = "unwind"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
