[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/slint-demo",
  "crates/agent-api",
  "crates/slint-contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
authors = ["Copilot"]
license = "MIT"
repository = "https://github.com/aheissenberger/slint-demo-01"
description = "Agent-operated Rust and Slint desktop application"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "warn"
suspicious = "warn"
perf = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
type_complexity = "warn"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
slint = "1.18.0"
slint-build = "1.18.0"
rfd = "0.17.2"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }

[profile.dev]
panic = "unwind"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
