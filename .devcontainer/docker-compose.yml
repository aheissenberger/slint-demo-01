services:
  devcontainer:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      DISPLAY: :1
      XDG_RUNTIME_DIR: /tmp/runtime-dir
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
      CARGO_TARGET_DIR: /workspace/target
      CARGO_TARGET_RETENTION_DAYS: 14
      CARGO_TARGET_MAX_GIB: 40
    volumes:
      - ..:/workspace:cached
      - cargo-downloads:/root/.cargo/downloads
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - target-cache:/workspace/target
      - vscode-extensions:/root/.vscode-server/extensions
      - vscode-extensions-cache:/root/.vscode-server/extensionsCache
      - vscode-global-storage:/root/.vscode-server/data/User/globalStorage
      - vscode-agent-session-data:/root/.vscode-server/data/agentSessionData
      - copilot-session-state:/root/.copilot/session-state
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"
    command: /bin/bash -lc "/workspace/.devcontainer/scripts/start-desktop.sh"

volumes:
  cargo-downloads:
  cargo-registry:
  cargo-git:
  target-cache:
  vscode-extensions:
  vscode-extensions-cache:
  vscode-global-storage:
  vscode-agent-session-data:
  copilot-session-state:
