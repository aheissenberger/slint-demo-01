[package]
name = "slint-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[[bin]]
name = "slint-demo"
path = "src/main.rs"

[features]
# agent-api is opt-in, not default, so a plain `cargo build`/`cargo build --release`
# never bundles the local automation HTTP server into a production binary
# (see SETUP-PROMPT.md section 25). Development and test workflows enable it
# explicitly via `--features agent-api` (see scripts/run, scripts/doctor, and
# .devcontainer/scripts/start-desktop.sh).
default = []
agent-api = ["dep:agent-api"]

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }
infrastructure = { path = "../infrastructure" }
agent-api = { path = "../agent-api", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
slint = { workspace = true }
rfd = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
