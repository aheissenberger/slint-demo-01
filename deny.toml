[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-selector" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-backend-winit" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-common" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-compiler" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-core" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-core-macros" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-femtovg" },
    { allow = ["GPL-3.0-only"], crate = "i-slint-renderer-software" },
    { allow = ["GPL-3.0-only"], crate = "slint" },
    { allow = ["GPL-3.0-only"], crate = "slint-build" },
    { allow = ["GPL-3.0-only"], crate = "slint-interpreter" },
    { allow = ["GPL-3.0-only"], crate = "slint-macros" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
